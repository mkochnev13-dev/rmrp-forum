<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форум RMRP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f14; color: #e2e8f0; font-family: sans-serif; padding: 16px; }
.container { max-width: 840px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; background: #11161d; padding: 16px 20px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
.tab-btn { background: #11161d; color: #94a3b8; border: 1px solid #1e293b; border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
.tab-btn.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
.btn { background: #0ea5e9; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-weight: bold; cursor: pointer; font-size: 13px; }
.btn-dark { background: #1e293b; color: #cbd5e1; }
.btn-red { background: #dc2626; color: #fff; }
.card { background: #11161d; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.thread-item { cursor: pointer; }
.thread-item:hover { border-color: #38bdf8; }
.badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
.badge-open { background: #064e3b; color: #34d399; }
.badge-closed { background: #450a0a; color: #f87171; }
.badge-cat { background: #1e293b; color: #38bdf8; margin-right: 6px; }
.badge-admin { background: #7f1d1d; color: #fca5a5; margin-left: 6px; }
input, textarea, select { width: 100%; background: #0b0f14; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
.post { border-left: 3px solid #334155; padding-left: 12px; margin-top: 12px; }
.post-admin { border-left-color: #ef4444; background: rgba(239,68,68,0.05); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.attached-img { max-width: 100%; max-height: 360px; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; display: block; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h2 style="font-size:19px;">Форум поддержки RMRP</h2>
            <span id="role-status" style="font-size:12px; color:#64748b;">Режим: Игрок</span>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-dark" onclick="adminLogin()">Вход Админа</button>
            <button class="btn" onclick="showNewThreadForm()">+ Новая тема</button>
        </div>
    </div>

    <div class="tabs" id="cat-tabs">
        <button class="tab-btn active" onclick="filterCategory('Все', this)">Все темы</button>
        <button class="tab-btn" onclick="filterCategory('Вопросы по RMRPЮрист', this)">Вопросы по RMRPЮрист</button>
        <button class="tab-btn" onclick="filterCategory('Жалобы и баги', this)">Жалобы и баги</button>
        <button class="tab-btn" onclick="filterCategory('Предложения', this)">Предложения</button>
    </div>

    <div id="new-thread-box" class="card" style="display:none;">
        <h3 style="margin-bottom:12px;">Создать обращение</h3>
        <select id="t-category">
            <option value="Вопросы по RMRPЮрист">Раздел: Вопросы по RMRPЮрист</option>
            <option value="Жалобы и баги">Раздел: Жалобы и баги</option>
            <option value="Предложения">Раздел: Предложения</option>
        </select>
        <input type="text" id="t-author" placeholder="Ваш игровой ник">
        <input type="text" id="t-title" placeholder="Заголовок темы">
        <textarea id="t-content" rows="4" placeholder="Текст обращения..."></textarea>
        <input type="text" id="t-img" placeholder="Ссылка на скриншот (необязательно)">
        <div style="display:flex; gap:8px;">
            <button class="btn" onclick="createThread()">Опубликовать</button>
            <button class="btn btn-dark" onclick="document.getElementById('new-thread-box').style.display='none'">Отмена</button>
        </div>
    </div>

    <div id="threads-list">Загрузка тем...</div>
    <div id="thread-view" style="display:none;"></div>
</div>
<script>
var SB_URL = "https://" + "unejwdoylcvtwyhjnltp" + ".supabase.co";
var SB_KEY = "sb_publishable_zxEzT7COe0uFc-WNIY0Qxg_Fmi5x-tO";
var headers = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json", "Prefer": "return=representation" };
var isAdmin = localStorage.getItem("rmrp_forum_admin") === "1";
var currentCat = "Все";

if (isAdmin) document.getElementById("role-status").innerHTML = 'Режим: <b style="color:#f87171;">Администратор</b>';

function adminLogin() {
    if (isAdmin) { localStorage.removeItem("rmrp_forum_admin"); location.reload(); return; }
    var p = prompt("Введите пароль администратора:");
    if (!p) return;
    fetch(SB_URL + "/rest/v1/rpc/verify_forum_admin", { method: "POST", headers: headers, body: JSON.stringify({ pass: p }) })
        .then(function(r) { return r.json(); })
        .then(function(ok) {
            if (ok === true) { localStorage.setItem("rmrp_forum_admin", "1"); location.reload(); }
            else alert("Неверный пароль!");
        });
}

function filterCategory(cat, btnEl) {
    currentCat = cat;
    document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
    if (btnEl) btnEl.classList.add("active");
    loadThreads();
}

function showNewThreadForm() {
    document.getElementById("thread-view").style.display = "none";
    document.getElementById("new-thread-box").style.display = "block";
}

function loadThreads() {
    document.getElementById("thread-view").style.display = "none";
    document.getElementById("cat-tabs").style.display = "flex";
    var list = document.getElementById("threads-list");
    list.style.display = "block";
    var url = SB_URL + "/rest/v1/forum_threads?order=created_at.desc";
    if (currentCat !== "Все") url += "&category=eq." + encodeURIComponent(currentCat);

    fetch(url, { headers: headers })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!Array.isArray(data) || data.length === 0) {
                list.innerHTML = '<div class="card" style="text-align:center; color:#64748b;">Тем пока нет. Нажмите «+ Новая тема»!</div>';
                return;
            }
            var html = "";
            for (var i = 0; i < data.length; i++) {
                var t = data[i];
                var stClass = t.status === "Закрыто" ? "badge-closed" : "badge-open";
                html += '<div class="card thread-item" onclick="openThread(' + t.id + ')">' +
                    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">' +
                    '<div><span class="badge badge-cat">' + (t.category || 'Общее') + '</span><b style="font-size:15.5px; color:#f8fafc;">' + t.title + '</b></div>' +
                    '<span class="badge ' + stClass + '">' + t.status + '</span></div>' +
                    '<div style="font-size:12px; color:#64748b;">Автор: ' + t.author + '</div></div>';
            }
            list.innerHTML = html;
        });
}

function createThread() {
    var category = document.getElementById("t-category").value;
    var author = document.getElementById("t-author").value.trim() || "Аноним";
    var title = document.getElementById("t-title").value.trim();
    var content = document.getElementById("t-content").value.trim();
    var image_url = document.getElementById("t-img").value.trim() || null;
    if (!title || !content) return alert("Заполните заголовок и текст!");

    fetch(SB_URL + "/rest/v1/forum_threads", {
        method: "POST", headers: headers,
        body: JSON.stringify({ category: category, author: author, title: title, content: content, image_url: image_url })
    }).then(function() {
        document.getElementById("new-thread-box").style.display = "none";
        document.getElementById("t-title").value = "";
        document.getElementById("t-content").value = "";
        document.getElementById("t-img").value = "";
        loadThreads();
    });
}

function openThread(id) {
    document.getElementById("threads-list").style.display = "none";
    document.getElementById("cat-tabs").style.display = "none";
    var view = document.getElementById("thread-view");
    view.style.display = "block";
    view.innerHTML = "Загрузка...";

    Promise.all([
        fetch(SB_URL + "/rest/v1/forum_threads?id=eq." + id, { headers: headers }).then(function(r) { return r.json(); }),
        fetch(SB_URL + "/rest/v1/forum_posts?thread_id=eq." + id + "&order=created_at.asc", { headers: headers }).then(function(r) { return r.json(); })
    ]).then(function(res) {
        var thread = res[0][0];
        var posts = res[1] || [];
        var adminBtns = isAdmin ? '<button class="btn btn-dark" onclick="toggleThreadStatus(' + thread.id + ',\'' + (thread.status === "Открыто" ? "Закрыто" : "Открыто") + '\')">Закрыть/Открыть</button> <button class="btn btn-red" onclick="deleteThread(' + thread.id + ')">Удалить</button>' : '';
        var html = '<div style="display:flex; justify-content:space-between; margin-bottom:12px;"><button class="btn btn-dark" onclick="loadThreads()">← Назад</button><div>' + adminBtns + '</div></div>';
        html += '<div class="card"><h3>' + thread.title + '</h3><div style="font-size:12px; color:#64748b; margin:6px 0 12px;">Автор: ' + thread.author + ' • Статус: ' + thread.status + '</div><div style="white-space:pre-wrap;">' + thread.content + '</div>' + (thread.image_url ? '<img src="' + thread.image_url + '" class="attached-img" onclick="window.open(this.src)">' : '') + '</div>';

        for (var i = 0; i < posts.length; i++) {
            var p = posts[i];
            var pClass = p.role === "Админ" ? "card post post-admin" : "card post";
            var badge = p.role === "Админ" ? '<span class="badge badge-admin">АДМИН</span>' : '';
            html += '<div class="' + pClass + '"><div style="font-size:12px; margin-bottom:6px;"><b>' + p.author + '</b> ' + badge + '</div><div style="white-space:pre-wrap;">' + p.content + '</div>' + (p.image_url ? '<img src="' + p.image_url + '" class="attached-img" onclick="window.open(this.src)">' : '') + '</div>';
        }

        if (thread.status === "Открыто" || isAdmin) {
            html += '<div class="card" style="margin-top:16px;"><h4 style="margin-bottom:10px;">Ответить</h4><input type="text" id="r-author" placeholder="Ваш ник" value="' + (isAdmin ? 'Администратор' : '') + '"><textarea id="r-content" rows="3" placeholder="Ответ..."></textarea><input type="text" id="r-img" placeholder="Ссылка на скриншот"><button class="btn" onclick="sendReply(' + thread.id + ')">Отправить</button></div>';
        }
        view.innerHTML = html;
    });
}

function sendReply(threadId) {
    var author = document.getElementById("r-author").value.trim() || (isAdmin ? "Администратор" : "Игрок");
    var content = document.getElementById("r-content").value.trim();
    var image_url = document.getElementById("r-img").value.trim() || null;
    if (!content) return alert("Введите ответ!");
    fetch(SB_URL + "/rest/v1/forum_posts", {
        method: "POST", headers: headers,
        body: JSON.stringify({ thread_id: threadId, author: author, role: isAdmin ? "Админ" : "Игрок", content: content, image_url: image_url })
    }).then(function() { openThread(threadId); });
}

function toggleThreadStatus(id, status) {
    fetch(SB_URL + "/rest/v1/forum_threads?id=eq." + id, { method: "PATCH", headers: headers, body: JSON.stringify({ status: status }) }).then(function() { openThread(id); });
}

function deleteThread(id) {
    if (!confirm("Удалить тему?")) return;
    fetch(SB_URL + "/rest/v1/forum_threads?id=eq." + id, { method: "DELETE", headers: headers }).then(function() { loadThreads(); });
}

loadThreads();
</script>
</body>
</html>
